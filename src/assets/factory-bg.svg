<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark Sky & Industrial Dusk Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#0b192c"/>
      <stop offset="100%" stop-color="#00255b"/>
    </linearGradient>

    <linearGradient id="torayBlueGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a3e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#004098" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a3e0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 163, 224, 0.07)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(0, 163, 224, 0.2)"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <rect width="1600" height="900" fill="url(#techGrid)"/>

  <!-- Ambient Blue Radial Glows -->
  <circle cx="1200" cy="300" r="450" fill="#00a3e0" opacity="0.12" filter="blur(60px)"/>
  <circle cx="300" cy="600" r="400" fill="#004098" opacity="0.25" filter="blur(80px)"/>

  <!-- Industrial Plant Silhouettes (PT. Indonesia Toray Synthetics Factory) -->
  <g opacity="0.85">
    <!-- Factory Building 1 - Polymerization Tower -->
    <rect x="150" y="420" width="180" height="380" rx="8" fill="url(#towerGrad)" stroke="rgba(0, 163, 224, 0.3)" stroke-width="1.5"/>
    <!-- Tank Pipe Structures -->
    <rect x="190" y="380" width="30" height="40" fill="#1e293b"/>
    <line x1="205" y1="320" x2="205" y2="380" stroke="#00a3e0" stroke-width="3" stroke-dasharray="4 2"/>
    <circle cx="205" cy="315" r="5" fill="#10b981"/>

    <!-- Windows & Process Indicator Lights -->
    <rect x="170" y="450" width="35" height="15" rx="3" fill="rgba(0, 163, 224, 0.5)"/>
    <rect x="220" y="450" width="35" height="15" rx="3" fill="rgba(0, 163, 224, 0.3)"/>
    <rect x="270" y="450" width="35" height="15" rx="3" fill="rgba(0, 163, 224, 0.5)"/>

    <rect x="170" y="490" width="35" height="15" rx="3" fill="rgba(16, 185, 129, 0.6)"/>
    <rect x="220" y="490" width="35" height="15" rx="3" fill="rgba(0, 163, 224, 0.5)"/>
    <rect x="270" y="490" width="35" height="15" rx="3" fill="rgba(245, 158, 11, 0.6)"/>

    <!-- Main Chemical Spherical Storage Tank -->
    <circle cx="440" cy="620" r="90" fill="url(#towerGrad)" stroke="rgba(0, 163, 224, 0.4)" stroke-width="2"/>
    <line x1="350" y1="620" x2="530" y2="620" stroke="rgba(0, 163, 224, 0.3)" stroke-width="2"/>
    <path d="M 440 530 L 440 710" stroke="rgba(0, 163, 224, 0.3)" stroke-width="2"/>

    <!-- Factory Building 2 - Spinning & Filament Yarn Plant -->
    <rect x="580" y="360" width="320" height="440" rx="12" fill="url(#towerGrad)" stroke="rgba(0, 64, 152, 0.5)" stroke-width="2"/>
    <!-- Spinning Chimneys & Ventilation -->
    <rect x="620" y="240" width="24" height="120" fill="#0f172a" stroke="rgba(0, 163, 224, 0.3)"/>
    <rect x="720" y="210" width="24" height="150" fill="#0f172a" stroke="rgba(0, 163, 224, 0.3)"/>
    <rect x="820" y="260" width="24" height="100" fill="#0f172a" stroke="rgba(0, 163, 224, 0.3)"/>

    <!-- Chimney Flashes -->
    <circle cx="632" cy="235" r="4" fill="#ef4444" opacity="0.9"/>
    <circle cx="732" cy="205" r="4" fill="#ef4444" opacity="0.9"/>
    <circle cx="832" cy="255" r="4" fill="#ef4444" opacity="0.9"/>

    <!-- Spinning Window Matrix -->
    <g fill="rgba(0, 163, 224, 0.35)">
      <rect x="610" y="400" width="40" height="20" rx="4"/>
      <rect x="670" y="400" width="40" height="20" rx="4"/>
      <rect x="730" y="400" width="40" height="20" rx="4"/>
      <rect x="790" y="400" width="40" height="20" rx="4"/>
      <rect x="850" y="400" width="40" height="20" rx="4"/>

      <rect x="610" y="450" width="40" height="20" rx="4" fill="rgba(16, 185, 129, 0.5)"/>
      <rect x="670" y="450" width="40" height="20" rx="4"/>
      <rect x="730" y="450" width="40" height="20" rx="4"/>
      <rect x="790" y="450" width="40" height="20" rx="4"/>
      <rect x="850" y="450" width="40" height="20" rx="4" fill="rgba(16, 185, 129, 0.5)"/>
    </g>

    <!-- Factory Building 3 - Power & Utility Center -->
    <rect x="960" y="480" width="240" height="320" rx="10" fill="url(#towerGrad)" stroke="rgba(0, 163, 224, 0.3)"/>
    <!-- Cooling Pipes -->
    <path d="M 900 600 Q 930 550 960 600" fill="none" stroke="#00a3e0" stroke-width="4"/>
    <path d="M 900 640 Q 930 590 960 640" fill="none" stroke="#10b981" stroke-width="4"/>

    <!-- HQ Data Center & Control Tower -->
    <rect x="1250" y="300" width="220" height="500" rx="14" fill="url(#towerGrad)" stroke="rgba(0, 163, 224, 0.5)" stroke-width="2"/>
    <!-- Data Center Glass Façade Lines -->
    <line x1="1250" y1="360" x2="1470" y2="360" stroke="rgba(0, 163, 224, 0.4)" stroke-width="2"/>
    <line x1="1250" y1="440" x2="1470" y2="440" stroke="rgba(0, 163, 224, 0.4)" stroke-width="2"/>
    <line x1="1250" y1="520" x2="1470" y2="520" stroke="rgba(0, 163, 224, 0.4)" stroke-width="2"/>
    <line x1="1250" y1="600" x2="1470" y2="600" stroke="rgba(0, 163, 224, 0.4)" stroke-width="2"/>

    <!-- Fiber Optic Network Line Across Facilities -->
    <path d="M 100 700 L 350 700 L 600 680 L 950 680 L 1250 660 L 1500 660" fill="none" stroke="url(#cyanGlow)" stroke-width="3" stroke-dasharray="8 4"/>
    
    <!-- Node Connection Points -->
    <circle cx="350" cy="700" r="7" fill="#00a3e0"/>
    <circle cx="600" cy="680" r="7" fill="#10b981"/>
    <circle cx="950" cy="680" r="7" fill="#f59e0b"/>
    <circle cx="1250" cy="660" r="7" fill="#8b5cf6"/>
  </g>

  <!-- Ground Line & Reflection Glow -->
  <rect x="0" y="780" width="1600" height="120" fill="#050a14"/>
  <line x1="0" y1="780" x2="1600" y2="780" stroke="#00a3e0" stroke-width="2" opacity="0.6"/>
</svg>
